[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quaecer-spec-qualification"
version = "1.0.0"
description = "Versioned specifications, schemas and conformance cases."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mariia Steeghs-Turchina" }]
dependencies = []

[project.urls]
Source = "https://github.com/quaecer/specs"

[tool.hatch.build.targets.wheel]
packages = ["src/quaecer"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "quaecer/spec_qualification/_assets/registry"
"schema" = "quaecer/spec_qualification/_assets/schema"
"spec" = "quaecer/spec_qualification/_assets/spec"
"suite" = "quaecer/spec_qualification/_assets/suite"

[dependency-groups]
dev = ["jsonschema==4.26.0", "mypy>=1.15,<2", "pre-commit>=4,<5", "pytest>=8,<10", "ruff==0.17.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
